<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1A2234" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FFB84D" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #FFFFFF; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #94A3B8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #E2E8F0; }
    .metric-value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 26px; fill: #FFFFFF; }
    .metric-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 12px; fill: #94A3B8; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="140" fill="#FF9900" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="160" fill="#00F0FF" opacity="0.10" filter="url(#glow)" />
  <circle cx="650" cy="180" r="100" fill="#10B981" opacity="0.08" filter="url(#glow)" />

  <!-- Border Outline -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Top Category Tag -->
  <g transform="translate(60, 45)">
    <rect width="210" height="30" rx="15" fill="rgba(255, 153, 0, 0.15)" stroke="rgba(255, 153, 0, 0.4)" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#FF9900" />
    <text x="30" y="20" class="badge-text" fill="#FFB84D">ENTERPRISE FINOPS ENGINE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="125" class="title">
    AWS Cost Optimization <tspan fill="url(#awsGrad)">Automation</tspan>
  </text>
  <text x="60" y="165" class="subtitle">
    Autonomous Serverless Governance • Automated Stale EBS Snapshot &amp; Orphan Resource Purging
  </text>

  <!-- Tags / Chips -->
  <g transform="translate(60, 195)">
    <!-- Tag 1: Lambda -->
    <rect x="0" y="0" width="130" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="14" y="21" class="badge-text">⚡ AWS Lambda</text>

    <!-- Tag 2: EventBridge -->
    <rect x="142" y="0" width="145" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="156" y="21" class="badge-text">⏰ EventBridge Cron</text>

    <!-- Tag 3: Python Boto3 -->
    <rect x="299" y="0" width="125" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="313" y="21" class="badge-text">🐍 Python Boto3</text>

    <!-- Tag 4: Zero Waste -->
    <rect x="436" y="0" width="135" height="32" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" />
    <text x="450" y="21" class="badge-text" fill="#34D399">🛡️ 100% Safe Purge</text>
  </g>

  <!-- Right Side Stat / Metric Cards -->
  <g transform="translate(780, 50)">
    <!-- Card 1: Cost Reduction -->
    <g transform="translate(0, 0)">
      <rect width="360" height="76" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <rect x="0" y="0" width="5" height="76" rx="2" fill="#10B981" />
      <text x="24" y="34" class="metric-value" fill="#34D399">Up to 70%</text>
      <text x="24" y="58" class="metric-label">REDUCTION IN STALE STORAGE SPEND</text>
      <circle cx="315" cy="38" r="20" fill="rgba(16, 185, 129, 0.15)" />
      <path d="M 315 28 L 322 35 L 318 35 L 318 48 L 312 48 L 312 35 L 308 35 Z" fill="#10B981" />
    </g>

    <!-- Card 2: Operating Overhead -->
    <g transform="translate(0, 92)">
      <rect width="360" height="76" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <rect x="0" y="0" width="5" height="76" rx="2" fill="#00F0FF" />
      <text x="24" y="34" class="metric-value" fill="#38BDF8">$0.00 / Mo</text>
      <text x="24" y="58" class="metric-label">RUNS COMPLETELY WITHIN AWS FREE TIER</text>
      <circle cx="315" cy="38" r="20" fill="rgba(0, 240, 255, 0.15)" />
      <text x="315" y="44" font-family="sans-serif" font-weight="900" font-size="16" fill="#38BDF8" text-anchor="middle">⚡</text>
    </g>

    <!-- Card 3: Execution Latency -->
    <g transform="translate(0, 184)">
      <rect width="360" height="76" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <rect x="0" y="0" width="5" height="76" rx="2" fill="#FF9900" />
      <text x="24" y="34" class="metric-value" fill="#FBBF24">&lt; 2.5s</text>
      <text x="24" y="58" class="metric-label">AVERAGE SCAN &amp; AUDIT RUNTIME</text>
      <circle cx="315" cy="38" r="20" fill="rgba(255, 153, 0, 0.15)" />
      <text x="315" y="44" font-family="sans-serif" font-weight="900" font-size="16" fill="#FBBF24" text-anchor="middle">⏱️</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="60" y="315" width="1080" height="2" fill="url(#awsGrad)" opacity="0.6" />
</svg>
